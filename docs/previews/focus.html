<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREL · Hồ sơ liên hệ</title><style>
:root{font-family:'Inter','Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#263F35;background:#F5F3EB;--pine:#284B3D;--ink:#283E36;--quiet:#6A786F;--line:#DADFD5;--champagne:#B49A74;--radius:14px;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(70% 75% at 96% 0%,#DEE9DC 0%,transparent 72%),radial-gradient(50% 65% at 3% 86%,#ECE2D4 0%,transparent 70%),#F5F3EB;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #A37B46;outline-offset:3px}button:disabled{opacity:.55;cursor:default}header.top{padding:25px clamp(22px,5vw,72px);border-bottom:1px solid rgba(47,75,59,.14);display:flex;align-items:center;justify-content:space-between;gap:18px}header .brand{font:500 28px Georgia,'Times New Roman',serif;letter-spacing:.16em;color:var(--pine)}.top-note{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#67786D}.layout{width:min(1100px,calc(100% - 56px));margin:clamp(48px,8vw,100px) auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(28px,6vw,84px);align-items:start}.editorial{padding-top:16px}.overline{color:#8A7354;font-weight:650;font-size:11px;letter-spacing:.14em;text-transform:uppercase}.editorial h1{font:400 clamp(40px,4.8vw,66px)/1.08 Georgia,'Times New Roman',serif;letter-spacing:-.035em;margin:21px 0 20px;max-width:520px}.lead{font-size:15px;line-height:1.82;color:#65746A;max-width:440px}.editorial .rule{height:1px;background:linear-gradient(90deg,#AC9774,#D7DACC 48%,transparent);margin:48px 0 20px}.record-type{font-size:12px;color:#6C786D}.record-type strong{font-weight:600;color:#425B4B;margin-right:14px}.sheet{background:linear-gradient(140deg,#FFFEFA 15%,#FAFAF5 66%,#F5F3EC);border:1px solid rgba(53,86,63,.13);border-radius:22px;box-shadow:0 22px 60px rgba(31,59,39,.075);padding:clamp(24px,3.5vw,38px);min-width:0}.sheet h2{font:400 clamp(26px,3vw,35px)/1.2 Georgia,'Times New Roman',serif;letter-spacing:-.018em;margin:11px 0 9px}.subtle{font-size:13px;line-height:1.8;color:#6D7D71;margin:0 0 28px}.fields{display:grid;gap:20px}.fields label{display:block;font-size:12px;font-weight:600;color:#52665A}.fields input{width:100%;min-height:48px;margin-top:9px;padding:12px 14px;background:#FFFEFA;border:1px solid #CCD7CA;border-radius:12px;color:#263C32;font-size:16px;transition:border-color .2s ease,box-shadow .2s ease}.fields input:focus{border-color:#829C8D;box-shadow:0 0 0 3px rgba(115,156,127,.12);outline:0}.actions{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}.actions button{min-height:46px;border-radius:var(--radius);padding:10px 18px;border:1px solid #CBD6CA;background:linear-gradient(110deg,#FFFEFA,#EDF2EB);color:#29483A;font-size:13px;font-weight:620;transition:transform .18s ease,background .18s ease;min-width:125px}.actions button:hover{transform:translateY(-1px)}.actions .primary{color:#FFFDF7;background:#284B3D;border-color:#284B3D;box-shadow:inset 0 1px rgba(255,255,255,.12)}.actions .primary:hover{background:#355A48}.quiet-footer{padding:32px 0;text-align:center;color:#899489;font-size:11px;letter-spacing:.04em}.veil{position:fixed;inset:0;z-index:20;background:rgba(23,42,32,.43);display:grid;place-items:center;padding:20px}.veil .sheet{width:min(440px,100%);padding:32px;box-shadow:0 32px 90px rgba(10,30,19,.25)}.veil p{line-height:1.7;font-size:13px;color:#68786E;margin:16px 0 0}.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){header.top{padding:20px}.top-note{font-size:9px}.layout{width:calc(100% - 36px);margin:40px auto;grid-template-columns:1fr;gap:27px}.editorial{padding:0}.editorial h1{font-size:39px;max-width:420px}.editorial .rule{margin:20px 0 12px}.lead{max-width:unset}.sheet{border-radius:19px}.actions button{flex:1;min-width:0}}@media(max-width:359px){.top-note{display:none}.editorial h1{font-size:36px}.actions{gap:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}
</style></head><body><header class="top"><div class="brand">AUREL</div><span class="top-note">PRIVATE PROPERTY WORKSPACE</span></header><main class="layout"><section class="editorial"><span class="overline">HỒ SƠ KHÁCH HÀNG / QUẢN LÝ THÔNG TIN</span><h1>Hồ sơ chủ sở hữu</h1><p class="lead">Thông tin liên hệ trong danh mục khách hàng.</p><div class="rule"></div><p class="record-type"><strong>Đang xem</strong> Thông tin liên hệ</p></section><section class="sheet" id="form-dialog" role="dialog" aria-modal="true" aria-labelledby="form-title" tabindex="-1"><span class="overline">AUREL / HỒ SƠ LIÊN HỆ</span><h2 id="form-title">Chỉnh sửa thông tin</h2><p class="subtle">Cập nhật thông tin liên hệ.</p><div class="fields"><label for="field">Tên liên hệ<input id="field" type="text" value="Khách hàng AUREL" autocomplete="off"></label><input style="visibility:hidden;position:absolute;left:0;width:1px;height:1px" aria-label="Trường ẩn"/></div><div class="actions"><button type="button" id="back">Khôi phục</button><button type="button" class="primary" id="open">Hủy chỉnh sửa</button></div><div id="result" role="status" aria-live="polite" class="visually-hidden"></div></section></main><footer class="quiet-footer">AUREL · Bản xem trước giao diện · Dữ liệu minh họa</footer><div id="portal"></div><script type="module">
import {dialogFocusables,topmostModal,containModalTab} from '../../frontend/src/lib/modal-focus.js';

const form=document.getElementById('form-dialog'),portal=document.getElementById('portal'),result=document.getElementById('result'),field=document.getElementById('field');
const initialValue=field.value;
function report(message){result.textContent=message}
function close(){portal.replaceChildren();document.getElementById('open').focus({preventScroll:true});report('Đã đóng xác nhận.')}
function discard(){field.value=initialValue;close();report('Đã bỏ các thay đổi chưa lưu.')}
function open(){if(document.getElementById('confirm-dialog'))return;const veil=document.createElement('div');veil.className='veil';veil.innerHTML=`<section class="sheet" id="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" tabindex="-1"><span class="overline">AUREL / XÁC NHẬN</span><h2 id="confirm-title">Bỏ thay đổi chưa lưu?</h2><p>Thông tin vừa điều chỉnh sẽ không được giữ lại.</p><div class="actions"><button type="button" id="keep">Tiếp tục chỉnh sửa</button><button type="button" class="primary" id="discard">Bỏ thay đổi</button></div></section>`;portal.append(veil);document.getElementById('keep').addEventListener('click',close);document.getElementById('discard').addEventListener('click',discard);document.getElementById('keep').focus({preventScroll:true});report('Đang xác nhận bỏ thay đổi.')}
document.getElementById('open').addEventListener('click',open);
document.getElementById('back').addEventListener('click',()=>{field.value=initialValue;report('Đã khôi phục giá trị ban đầu.')});
document.addEventListener('keydown',event=>{const nested=document.getElementById('confirm-dialog');const active=nested||form;if(!topmostModal(active))return;if(event.key==='Escape'&&nested){event.preventDefault();close();return}containModalTab(event,active,active.querySelector('button:not(:disabled)')||active)});
document.addEventListener('focusin',event=>{const nested=document.getElementById('confirm-dialog'),active=nested||form;if(topmostModal(active)&&!active.contains(event.target))active.querySelector('button:not(:disabled)')?.focus({preventScroll:true})});
window.AUREL_V235={open,close,focusables:()=>dialogFocusables(document.getElementById('confirm-dialog')||form).length,top:()=>topmostModal(document.getElementById('confirm-dialog')||form)};
</script></body></html>
