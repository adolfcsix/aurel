# Local development database only. Replace credentials before any shared deployment.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurel
      POSTGRES_PASSWORD: aurel_local_only
      POSTGRES_DB: aurel
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - aurel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurel -d aurel"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Opt-in, isolated, ephemeral PostgreSQL for QA. Never shares the main volume.
  # Launch with: docker compose --profile qa up -d db-test
  db-test:
    profiles: ["qa"]
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: aurelqa
      POSTGRES_PASSWORD: aurel_qa_disposable_only
      POSTGRES_DB: aurel_workspace_test
    ports:
      - '127.0.0.1:5436:5432'
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelqa -d aurel_workspace_test"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  aurel_pgdata:
